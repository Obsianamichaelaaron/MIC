{% include 'includes/header.html' %}

<style>
	body {
		background: #f4f6f9;
		color: #1e293b;
		font-family: 'DM Sans', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
	}
	.container {
		width: 100%;
		max-width: 100% !important;
		margin: 0 auto;
		padding: 0 1.25rem 2rem;
		font-family: 'DM Sans', sans-serif;
	}
	.container h3 { font-size: 1.4rem; line-height: 1.25; font-weight: 700; color: #0f172a; }
	.container h5 { font-size: 1rem; line-height: 1.35; font-weight: 600; color: #1e293b; }
	.container p,
	.container .small { font-size: .82rem; }
	.container .form-control,
	.container .form-select,
	.container .btn { font-family: 'DM Sans', sans-serif; }
	.employer-hero-banner {
		position: relative !important;
		overflow: hidden !important;
		padding: 1.65rem 2rem !important;
		border-radius: 18px !important;
		margin-bottom: 1.75rem !important;
		background: linear-gradient(135deg, #09203f 0%, #1e40af 55%, #0284c7 100%) !important;
		color: #ffffff !important;
		box-shadow: 0 10px 30px rgba(10, 61, 107, 0.18) !important;
		min-height: 96px !important;
		box-sizing: border-box !important;
	}
	.employer-hero-banner h1, .employer-hero-banner h2, .employer-hero-banner h3, .employer-hero-banner h4 {
		font-size: 1.55rem !important;
		font-weight: 800 !important;
		line-height: 1.25 !important;
		letter-spacing: -0.02em !important;
		color: #ffffff !important;
		margin: 0 !important;
		text-shadow: 0 1px 3px rgba(0,0,0,0.25) !important;
	}
	.employer-hero-banner .breadcrumb-item,
	.employer-hero-banner .breadcrumb-item a,
	.employer-hero-banner .text-white-50 {
		color: rgba(255, 255, 255, 0.9) !important;
		font-size: 0.78rem !important;
	}
	.employer-hero-banner .breadcrumb-item.active {
		color: #ffffff !important;
		font-weight: 700 !important;
		font-size: 0.78rem !important;
	}
	.employer-hero-banner p {
		font-size: 0.88rem !important;
		color: rgba(255, 255, 255, 0.95) !important;
		margin: 0.35rem 0 0 !important;
		line-height: 1.45 !important;
	}
	.employer-hero-banner::after {
		content: '';
		position: absolute;
		width: 260px;
		height: 260px;
		right: -60px;
		top: -100px;
		border: 36px solid rgba(255, 255, 255, 0.07);
		border-radius: 50%;
		pointer-events: none;
	}
	.portal-hero-content { position: relative; z-index: 1; }
	.custom-card {
		border: 1px solid #e2e8f0 !important;
		border-radius: 16px !important;
		box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05) !important;
		background: #ffffff;
	}
	.btn-primary-custom {
		border: 0;
		background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
		color: #ffffff;
		font-weight: 600;
		border-radius: 8px;
		padding: 0.55rem 1.15rem;
		box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);
		transition: all 0.2s ease;
	}
	.btn-primary-custom:hover,
	.btn-primary-custom:focus {
		background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
		color: #ffffff;
		transform: translateY(-1px);
		box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
	}
	.cms-nav-tabs .nav-link.active {
		background: #0284c7 !important;
		color: #ffffff !important;
		box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
	}
	.cms-nav-tabs .nav-link.active .badge {
		background: rgba(255, 255, 255, 0.25) !important;
		color: #ffffff !important;
	}
</style>

{% block extra_css %}{% endblock %}

{% block content %}{% endblock %}

{% block extra_js %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
