{% include 'includes/header.html' %}

<style>
	body {
		background: #c7d1dd;
	}
	.container {
		width: 100%;
		max-width: 1240px !important;
		margin: 0 auto;
		padding: 0 .75rem 1rem;
		font-family: 'DM Sans', sans-serif;
	}
	.container h3 { font-size: 1.4rem; line-height: 1.25; }
	.container h5 { font-size: 1rem; line-height: 1.35; }
	.container p,
	.container .small { font-size: .78rem; }
	.container .form-control,
	.container .form-select,
	.container .btn { font-family: 'DM Sans', sans-serif; }
	.employer-hero-banner {
		position: relative;
		overflow: hidden;
		padding: 1.5rem 1.75rem;
		border-radius: 16px;
		background: linear-gradient(135deg, #0a3d6b 0%, #1866a3 58%, #2196f3 100%);
		color: #ffffff;
		box-shadow: 0 8px 22px rgba(10, 61, 107, 0.16);
	}
	.employer-hero-banner::after {
		content: '';
		position: absolute;
		width: 220px;
		height: 220px;
		right: -80px;
		top: -130px;
		border: 34px solid rgba(255, 255, 255, 0.08);
		border-radius: 50%;
	}
	.portal-hero-content { position: relative; z-index: 1; }
	.custom-card {
		border: 1px solid #e2e8f0 !important;
		border-radius: 14px !important;
		box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06) !important;
	}
	.btn-primary-custom {
		border: 0;
		background: #0056b3;
		color: #ffffff;
		font-weight: 600;
	}
	.btn-primary-custom:hover,
	.btn-primary-custom:focus {
		background: #00458f;
		color: #ffffff;
	}
	.cms-nav-tabs .nav-link.active {
		background: #0056b3 !important;
		color: #ffffff !important;
		box-shadow: 0 4px 14px rgba(0, 86, 179, 0.25);
	}
	.cms-nav-tabs .nav-link.active .badge {
		background: rgba(255, 255, 255, 0.25) !important;
		color: #ffffff !important;
	}
</style>

{% block extra_css %}{% endblock %}

{% block content %}{% endblock %}

{% block extra_js %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
